[package]
name = "cursor-skill-toggle"
version = "0.1.0"
edition = "2021"
description = "Enable/disable Cursor skills via registry and SKILL.md frontmatter"
license = "MIT"

[[bin]]
name = "cst"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
dialoguer = "0.11"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"

[dev-dependencies]
tempfile = "3"